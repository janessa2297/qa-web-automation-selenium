name: API UI hybrid tests
on:
  push:
    paths: ['api-ui-hybrid-testing/**', '.github/workflows/api-ui-hybrid-tests.yml']
  pull_request:
    paths: ['api-ui-hybrid-testing/**', '.github/workflows/api-ui-hybrid-tests.yml']
  workflow_dispatch:
    inputs:
      groups:
        description: TestNG group
        type: choice
        options: [smoke, api, ui, integration, regression]
        default: regression
      public_demo:
        description: Also run read-only smoke against the shared public demo
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hybrid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: api-ui-hybrid-testing
    steps:
      - uses: actions/checkout@v4
      - name: Install test JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api-ui-hybrid-testing/pom.xml
      - name: Remember test JDK
        run: '"TEST_JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - name: Install application JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - name: Run isolated application and tests
        env:
          TEST_GROUPS: ${{ inputs.groups || 'regression' }}
        run: ./scripts/Run-LocalRegression.ps1 -TestJavaHome $env:TEST_JAVA_HOME -AppJavaHome $env:JAVA_HOME -Groups $env:TEST_GROUPS
      - name: Upload local diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-local-diagnostics
          path: |
            api-ui-hybrid-testing/target/surefire-reports/
            api-ui-hybrid-testing/target/reports/
            api-ui-hybrid-testing/target/screenshots/
          retention-days: 7
  public-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.public_demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api-ui-hybrid-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api-ui-hybrid-testing/pom.xml
      - name: Run selected suite (public demo writes disabled)
        env:
          ALLOW_MUTATIONS: 'false'
        run: mvn -B -ntp clean test -Dgroups=smoke -Dheadless=true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-diagnostics
          path: |
            api-ui-hybrid-testing/target/surefire-reports/
            api-ui-hybrid-testing/target/reports/
            api-ui-hybrid-testing/target/screenshots/
          retention-days: 7
